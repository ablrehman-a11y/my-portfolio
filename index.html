<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Rehman — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --card: #1
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.1s ease;
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transition: transform 0.15s ease, width 0.2s, height 0.2s, opacity 0.2s;
    opacity: 0.5;
  }

  /* Grid Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.12;
  }
  .blob-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; right: -200px; }
  .blob-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; left: -150px; }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 60px;
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .nav-toggle {
    display: none;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    background: transparent;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .nav-toggle span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .nav-toggle span + span {
    margin-top: 6px;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }

  .nav-links.active {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: absolute;
    top: 72px;
    right: 20px;
    background: rgba(13,17,23,0.96);
    padding: 18px 20px;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }

  /* HERO */
  .hero {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 120px 60px 80px;
  }

  .hero-inner {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 60px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--highlight);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    animation: fadeUp 0.6s ease both;
  }

  .hero-badge .dot {
    width: 6px; height: 6px;
    background: var(--accent3);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .hero-name {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 7vw, 96px);
    line-height: 0.95;
    letter-spacing: -3px;
    color: var(--text);
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .hero-name span {
    color: transparent;
    -webkit-text-stroke: 1px rgba(0,212,255,0.5);
  }

  .hero-tagline {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.5;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .hero-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    max-width: 480px;
    margin-top: 20px;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .hero-cta {
    display: flex;
    gap: 14px;
    margin-top: 36px;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .btn-primary:hover {
    background: #33ddff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,212,255,0.3);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: transparent;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: all 0.2s;
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }

  /* Hero right side - stats */
  .hero-stats {
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: fadeUp 0.6s 0.5s ease both;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    text-align: center;
    min-width: 140px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .stat-number {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--accent);
    display: block;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  /* SECTIONS */
  section {
    position: relative;
    z-index: 1;
    padding: 100px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::before {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--accent);
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;
    color: var(--text);
    margin-bottom: 60px;
    line-height: 1.1;
  }

  /* EDUCATION */
  .timeline {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2), transparent);
  }

  .timeline-item {
    padding: 0 0 48px 40px;
    position: relative;
  }

  .timeline-dot {
    position: absolute;
    left: -5px;
    top: 6px;
    width: 11px; height: 11px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  .timeline-meta {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--accent3);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .timeline-degree {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .timeline-institution {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .timeline-field {
    font-size: 13px;
    color: var(--muted);
  }

  /* SKILLS */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .skill-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,212,255,0.1);
  }
  .skill-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, var(--highlight), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .skill-card:hover::after { opacity: 1; }

  .skill-icon {
    font-size: 28px;
    margin-bottom: 14px;
    display: block;
  }

  .skill-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
  }

  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 3px 10px;
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 100px;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }

  /* Language bars */
  .lang-item {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .lang-name {
    font-size: 13px;
    color: var(--text);
    min-width: 80px;
  }
  .lang-bar-bg {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .lang-bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform-origin: left;
    animation: barGrow 1s ease both;
  }
  @keyframes barGrow {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .lang-level {
    font-size: 11px;
    color: var(--muted);
    min-width: 90px;
    text-align: right;
  }

  /* EXPERIENCE */
  .exp-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    margin-bottom: 20px;
    transition: all 0.3s;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 28px;
    align-items: start;
  }
  .exp-card:hover {
    border-color: var(--accent);
    box-shadow: 0 16px 40px rgba(0,212,255,0.08);
  }

  .exp-icon {
    width: 52px; height: 52px;
    background: var(--highlight);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .exp-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .exp-org {
    font-size: 12px;
    color: var(--accent3);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .exp-duration {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.2);
    border-radius: 100px;
    font-size: 11px;
    color: var(--accent3);
    margin-bottom: 16px;
  }

  .exp-bullets {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .exp-bullets li {
    font-size: 13px;
    color: var(--muted);
    padding-left: 16px;
    position: relative;
    line-height: 1.7;
  }
  .exp-bullets li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  /* CERTIFICATION */
  .cert-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    transition: all 0.3s;
  }
  .cert-card:hover {
    border-color: var(--accent2);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(124,58,237,0.15);
  }
  .cert-icon {
    font-size: 32px;
    flex-shrink: 0;
  }
  .cert-name {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .cert-issuer {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cert-badge {
    margin-left: auto;
    padding: 4px 12px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 100px;
    font-size: 10px;
    color: #a78bfa;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* CONTACT */
  .contact-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .contact-section::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 400px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .contact-title {
    font-family: 'Syne', sans-serif;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--text);
    margin-bottom: 16px;
  }

  .contact-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .contact-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
  }

  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background: transparent;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    transition: all 0.2s;
  }
  .contact-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--highlight);
    transform: translateY(-2px);
  }

  .nav-links.active {
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: absolute;
    top: 72px;
    right: 20px;
    background: rgba(13,17,23,0.96);
    padding: 18px 20px;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }

  /* FOOTER */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 60px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Mobile nav */
  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    .nav-toggle { display: flex; }
    .nav-links {
      display: none;
      position: static;
      gap: 14px;
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
      align-items: center;
    }
    .nav-links.active { display: flex; }
    section { padding: 60px 20px; }
    .hero { padding: 100px 20px 60px; }
    .hero-inner { grid-template-columns: 1fr; }
    .hero-stats { flex-direction: row; flex-wrap: wrap; }
    .stat-card { min-width: 100px; }
    .exp-card { grid-template-columns: 1fr; }
    .contact-section { padding: 40px 24px; }
    .contact-title { font-size: 32px; }

  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
